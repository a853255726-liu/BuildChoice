<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小票核对</title>
<body><main><h1>小票核对</h1><button id="recognize">识别示例小票</button>
<form id="review" hidden><h2>核对识别结果</h2>
<label>金额 <input id="amount" name="amount" type="number" step="0.01" required></label>
<label>日期 <input id="date" name="date" type="date" required></label>
<label>类别 <input id="category" name="category" required></label>
<button type="submit">确认并正式保存</button><button id="cancel" type="button">取消</button></form>
<p id="message" role="status"></p></main><script src="app.js"></script></body></html>
