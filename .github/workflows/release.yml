name: Publish BuildChoice release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'buildchoice/desktop/bundle.py'

permissions:
  contents: read

concurrency:
  group: buildchoice-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit, MCP and source/bundle checks
        run: |
          python -m unittest discover -s checks -v
          python checks/smoke_mcp.py
          python checks/check_package.py
      - name: Build licensed distribution packages
        run: python scripts/build_distribution.py
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          version=$(python -c "from buildchoice.desktop.bundle import VERSION; print(VERSION)")
          tag="v$version"
          if gh release view v0.9.1 > /dev/null 2>&1; then
            gh release edit v0.9.1 --notes-file docs/releases/v0.9.1.md
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; preserving its tag and assets."
            exit 0
          fi
          gh release create "$tag" \
            "dist/buildchoice-core-$version.zip" \
            "dist/buildchoice-core-$version.zip.sha256" \
            "dist/buildchoice-plugin-$version.zip" \
            "dist/buildchoice-plugin-$version.zip.sha256" \
            --target "$RELEASE_COMMIT" \
            --title "BuildChoice $version" \
            --notes-file "docs/releases/v$version.md"
